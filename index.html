     <script>
          document.addEventListener("DOMContentLoaded", function () {
            const targetDate = new Date("May 15, 2025 12:00:00").getTime();
            const countdown = document.querySelector(".countdown");
        
            const interval = setInterval(() => {
              const now = new Date().getTime();
              const distance = targetDate - now;
        
              if (distance < 0) {
                clearInterval(interval);
                countdown.innerHTML = "<h1>We’re Ready!</h1>";
                return;
              }
        
              const days = Math.floor(distance / (1000 * 60 * 60 * 24));
              const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
              const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
              const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
              countdown.innerHTML = `
                <li><span>${days}</span><h3>Days</h3></li>
                <li><span>${hours}</span><h3>Hours</h3></li>
                <li><span>${minutes}</span><h3>Minutes</h3></li>
                <li><span>${seconds}</span><h3>Seconds</h3></li>
              `;
            }, 1000);
          });
          document.addEventListener("DOMContentLoaded", function () {
    const title = "BORDER WALA IS GETTING READY!!!!!!";
    const target = document.getElementById("animated-title");
    let index = 0;

    function typeLetter() {
      if (index < title.length) {
        target.innerHTML += title[index] === " " ? "&nbsp;" : title[index];
        index++;
        setTimeout(typeLetter, 100); // adjust speed here
      }
    }

    typeLetter();
  });
        </script>
